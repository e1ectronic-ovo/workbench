name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # fetch-core 会先拉内核与 GeoIP，再打 NSIS 安装包并上传到 Release
        run: npm run release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
