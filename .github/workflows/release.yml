name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        # 只构建，不由 electron-builder 上传：多目标并发发布会给同一个 tag 建出重复 Release，
        # 导致 releases/latest 指向只有 blockmap 的那份，客户端拿不到 latest.yml。
        shell: bash
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee build.log

      # 失败原因通过 annotation 暴露：Actions 日志要鉴权才能看，注解是公开可读的
      - name: 输出失败原因
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            tail -n 25 build.log | tr -d '\r' | sed '/^$/d' | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "不是 tag 触发，跳过发布"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          ASSETS="dist/*.exe dist/*.blockmap dist/latest.yml"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" $ASSETS --title "$TAG" --generate-notes --latest
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
